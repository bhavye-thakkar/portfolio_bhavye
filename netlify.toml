# The Netlify deployments of this repo (bhavyethakkar, thakkarbhavya,
# bhavyathakkar and thakkarbhavye .netlify.app) serve the whole site
# themselves: no redirect to Vercel (owner, 2026-11-26), every page is there.
#
# Setting SITE_ORIGIN here, in the repo rather than per site in the Netlify
# dashboard, makes every Netlify build stamp the Vercel address into its
# canonical tags, sitemap, robots.txt and llms.txt (scripts/siteOrigin.ts), so
# search engines credit ONE address with all of them. Four self-declared
# copies of one site were what Search Console reported as "Duplicate, Google
# chose different canonical than user".
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SITE_ORIGIN = "https://bhavye.vercel.app"
