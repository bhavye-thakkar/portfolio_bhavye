# The Netlify deployments of this repo (bhavyethakkar, thakkarbhavya,
# bhavyathakkar and thakkarbhavye .netlify.app) serve the whole site
# themselves: no redirect to Vercel (owner, 2026-11-26), every page is there.
#
# Setting SITE_ORIGIN here, in the repo rather than per site in the Netlify
# dashboard, makes every Netlify build stamp the Vercel address into its
# canonical tags, sitemap, robots.txt and llms.txt (scripts/siteOrigin.ts), so
# search engines credit ONE address with all of them. Four self-declared
# copies of one site were what Search Console reported as "Duplicate, Google
# chose different canonical than user".
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SITE_ORIGIN = "https://bhavye.vercel.app"

# Served like the original now that these copies serve pages: vercel.json's
# headers word for word (seo-check's live mode fails if the CSP drifts). The
# hashed files (/assets, /chunks) never change, so a browser keeps them a year
# instead of asking again on every visit (Netlify's default is max-age=0).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/chunks/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
