    <!--
      ── THE PRELOADER'S OWN STYLES, INLINE AND ON PURPOSE ─────────────────

      This used to live in src/assets/styles/preloader.scss, which ships inside
      the JS bundle. That meant the preloader, the one thing on the page whose
      entire job is to look right before anything else has loaded, was the
      last thing to get styled.

      Unstyled, `.preloader` is a static div and the SVG inside it has no
      width, so it auto-sizes to the full viewport: a 1400px grey logo on a
      white page. That is what a visitor sees for the whole of a slow first
      paint, and *permanently* if the bundle fails to execute at all (a missing
      asset import is enough, see src/assets/thumbnails/). The screen that is
      supposed to hide a broken boot was drawing the broken boot.

      So the rules live here, in the same document as the markup, and there is
      no .scss copy of them to drift out of sync. Each colour is declared twice:
      the literal for the first paint, then the token, which wins the moment
      colors.scss lands. Keep these values in step with:
        --color-beige-400 / --color-text-400   src/assets/styles/colors.scss
        --z-index-preloader / --ease-power2-in src/assets/styles/variables.scss
    -->
    <style>
      .is-loading {
        overscroll-behavior: none;
        position: fixed;
        width: 100%;
        height: 100%;
      }

      .preloader {
        position: fixed;
        z-index: 100;
        z-index: var(--z-index-preloader, 100);
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #f5efe6;
        background-color: var(--color-beige-400, #f5efe6);
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.3s ease-in-out;
        opacity: 1;
      }

      .preloader-svg {
        width: 120px;
        height: 120px;
        transition:
          transform 0.2s var(--ease-power2-in, cubic-bezier(0.165, 0.84, 0.44, 1)),
          opacity 0.2s var(--ease-power2-in, cubic-bezier(0.165, 0.84, 0.44, 1));
      }

      .preloader-rect {
        transform-origin: bottom center;
        transition: transform 0.3s ease-in-out;
      }

      .preloader-path {
        fill: #2d2a24;
        fill: var(--color-text-400, #2d2a24);
      }

      .preloader-hidden {
        opacity: 0;
        pointer-events: none !important;
      }

      .preloader-hidden * {
        pointer-events: none !important;
      }

      .preloader-hidden svg {
        transform: scale(0.4);
        opacity: 0;
      }
    </style>
  </head>

      ── THE CRAWLABLE COPY OF THIS PAGE ───────────────────────────────────

      Everything visual on this site is drawn by JavaScript, so without this

      links. Google runs JS and sees the real app, but the crawlers behind AI
      answers mostly do not, they were being handed a blank document.

      IT LIVES IN A NOSCRIPT BLOCK ON PURPOSE. It was inside #app first, on the
      theory that Vue clears that container before it mounts. It does, but
      only once the bundle has run, and the stylesheet arrives with that same
      bundle in dev, so every refresh painted this as an unstyled document
      first. A parser never renders noscript content when scripting is on, so
      there is nothing to flash and nothing to hide with CSS; a crawler that
      does not execute JS still reads it straight out of the HTML source.

      Two rules for editing it:
        · It must stay TRUE to what the rendered page says. This is a no-JS
          fallback, not a keyword box, text here that the real page does not
          back up is cloaking, and it is what gets a site penalised.
        · Every fact below is in src/content/profile.ts (the Experience list
          in src/content/experience.ts). Change it there and mirror it here
          and in public/llms.txt. It lists exactly what the site renders: the
