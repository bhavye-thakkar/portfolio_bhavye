    <!--
      ── THE PRELOADER'S OWN STYLES, INLINE AND ON PURPOSE ─────────────────

      This used to live in src/assets/styles/preloader.scss, which ships inside
      the JS bundle. That meant the preloader, the one thing on the page whose
      entire job is to look right before anything else has loaded, was the
      last thing to get styled.

      Unstyled, `.preloader` is a static div and the SVG inside it has no
      width, so it auto-sizes to the full viewport: a 1400px grey logo on a
      white page. That is what a visitor sees for the whole of a slow first
      paint, and *permanently* if the bundle fails to execute at all (a missing
      asset import is enough, see src/assets/thumbnails/). The screen that is
      supposed to hide a broken boot was drawing the broken boot.

      So the rules live here, in the same document as the markup, and there is
      no .scss copy of them to drift out of sync. Each colour is declared twice:
      the literal for the first paint, then the token, which wins the moment
      colors.scss lands. Keep these values in step with:
        --color-beige-400 / --color-text-400   src/assets/styles/colors.scss
        --z-index-preloader                    src/assets/styles/variables.scss

      ── THE CHOREOGRAPHY ──────────────────────────────────────────────────

      The avatar walks in from the left pushing a dark door, pushes it right
      across the screen and off it, walking off after it, and the name is
      left alone. Then the page wipes away from the top to reveal Home.
      usePreloader.ts runs it as one state machine:

        shut    The door waits for him (.preloader-nudge breathes a sliver of
                light at its edge if that takes a while). Dark, as the
                reference is for its first half second.
        push    .preloader-arrive. The door is ONE linear animation, created by
                usePreloader.ts, from shut to off the far edge, at about 40% of
                the screen a second: the reference's pace. He rides its edge
                with his hands on it, and his legs follow the distance it has
                moved (loader-avatar.ts), so nothing slides. It never pauses:
                on a slow connection he walks off and the name waits alone.
                It used to run on CSS timings of its own (a 0.5s shove and
                four heaves), which dragged him eleven strides per step, and
                then at a 2-steps-a-second stroll with a stop beside the name,
                which read as sluggish and unfinished.
        boot    Once he is off the screen and the assets are in, Home's 3D
                scene boots: its long tasks land on the still name.
        exit    .preloader-exit, the wipe, once the room's first frame exists.

      Every moving part is transform or opacity, so the compositor runs it.
    -->
    <style>
      /* The display face for the name, under its own family name so it cannot
         touch the site's own faces in fonts.scss. Same file, already preloaded
         above, so it costs no second request. `block`: the door covers the
         name for its first half second, a fallback face would only be seen
         being swapped out. */
      @font-face {
        font-family: "Urbanist Preloader";
        src: url(/fonts/urbanist-900.woff2) format("woff2");
        font-weight: 900;
        font-display: block;
      }

      .is-loading {
        overscroll-behavior: none;
        position: fixed;
        width: 100%;
        height: 100%;
      }

      .preloader {
        --preloader-avatar: min(42vh, 60vw);
        --preloader-ease-wipe: cubic-bezier(0.76, 0, 0.24, 1);
        --preloader-ease-give: cubic-bezier(0.32, 0, 0.67, 0);
        position: fixed;
        z-index: 100;
        z-index: var(--z-index-preloader, 100);
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f5efe6;
        background-color: var(--color-beige-400, #f5efe6);
        transition: transform 0.6s var(--preloader-ease-wipe);
      }

      /* The wipe is two opposite moves: the window slides down while the stage
         inside it slides up by the same amount, so the name stays put and a
         straight edge travels down over it. Two transforms instead of an
         animated clip-path, which Chrome still paints on the main thread. */
      .preloader-stage,
      .preloader-curtain,
      .preloader-nudge,
      .preloader-door {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      .preloader-stage {
        transition: transform 0.6s var(--preloader-ease-wipe);
      }

      .preloader-exit {
        transform: translateY(100%);
        pointer-events: none;
      }

      .preloader-exit .preloader-stage {
        transform: translateY(-100%);
      }

      .preloader-name {
        position: absolute;
        top: 50%;
        left: 50%;
        margin: 0;
        transform: translate(-50%, -50%);
        color: #2d2a24;
        color: var(--color-text-400, #2d2a24);
        font-family: "Urbanist Preloader", sans-serif;
        font-weight: 900;
        font-size: clamp(52px, min(11vw, 14vh), 120px);
        line-height: 1.09;
        letter-spacing: 0.02em;
        text-align: center;
        white-space: nowrap;
      }

      /* While the door is still waiting for him: someone is at it. A sliver of
         light at its edge, opening and closing, so a wait that runs past half a
         second (a slow connection, the unbundled dev server) never looks like
         a dead black page. Its delay keeps it off a fast load entirely, and it
         is frozen where it stands the moment he arrives. */
      .preloader-nudge {
        animation: preloader-nudge 1.5s cubic-bezier(0.45, 0, 0.55, 1) 0.7s infinite;
      }

      .preloader-arrive .preloader-nudge {
        animation-play-state: paused;
      }

      .preloader-door {
        background-color: #2d2a24;
        background-color: var(--color-text-400, #2d2a24);
      }

      /* Rides the door's left edge, inside the nudge so the two never part.
         The canvas overlaps the door by 6% of its width (0.054 of 0.9): his
         hands are framed to end 1% past the door's edge (loader-avatar.ts,
         PALMS_AT), pressing on it, so no rounding can open a gap between them. */
      .preloader-walker {
        position: absolute;
        right: calc(100% - var(--preloader-avatar) * 0.054);
        bottom: calc(50% - var(--preloader-avatar) * 0.56);
        width: calc(var(--preloader-avatar) * 0.9);
        height: var(--preloader-avatar);
      }

      /* The 3D avatar, drawn by src/three/loader-avatar.ts into this canvas.
         Hidden until his first frame exists (.preloader-live). No fade: the
         door waits for him, so he is off-screen at that moment and walks in
         solid. A translucent 3D body reads as a glitch, not an entrance. Only
         when the wait ran out and the door left without him (.preloader-late)
         does he have to appear in plain sight, and then he fades. */
      .preloader-avatar {
        position: relative;
        width: 100%;
        height: 100%;
        opacity: 0;
      }

      .preloader-live .preloader-avatar {
        opacity: 1;
      }

      .preloader-late .preloader-avatar {
        transition: opacity 0.3s ease-out;
      }

      /* A soft pool of shadow under his feet, so he stands on the floor
         instead of floating in front of it. */
      .preloader-avatar::after {
        content: "";
        position: absolute;
        left: 8%;
        right: 24%;
        bottom: -2.5%;
        height: 6%;
        background: radial-gradient(ellipse at center, rgba(45, 42, 36, 0.22) 0%, rgba(45, 42, 36, 0) 68%);
      }

      .preloader-avatar canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* No WebGL: the canvas is swapped for a sheet of his pre-rendered frames,
         one frame's worth of it shown at a time (loader-avatar.ts, mountSheet). */
      .preloader-sheet {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .preloader-sheet img {
        display: block;
        max-width: none;
      }

      /* Portrait has no room beside the name, and plenty above and below it:
         the name goes up and he walks underneath it. */
      @media (orientation: portrait) {
        .preloader-name {
          top: 33%;
        }

        .preloader-walker {
          bottom: 21%;
        }
      }

      @keyframes preloader-nudge {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(1.1%);
        }
      }

      /* No door, no walk: the name is simply there, and leaves with a fade. */
      @media (prefers-reduced-motion: reduce) {
        .preloader-curtain {
          display: none;
        }

        .preloader,
        .preloader-stage {
          transition: opacity 0.4s ease;
        }

        .preloader-exit {
          opacity: 0;
        }

        .preloader-exit,
        .preloader-exit .preloader-stage {
          transform: none;
        }
      }
    </style>
